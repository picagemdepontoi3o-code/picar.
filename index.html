<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I3O - Gestão de Equipa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            background: radial-gradient(circle at top right, #0f172a, #020617); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            color: white; 
            margin: 0; 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .btn-punch-in { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
        }
        .btn-punch-out { 
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); 
        }
        .btn-locked { 
            opacity: 0.15; 
            filter: grayscale(1); 
            pointer-events: none; 
        }
        .neo-click:active { 
            transform: scale(0.96); 
        }
        .no-scrollbar::-webkit-scrollbar { 
            display: none; 
        }
        input[type="date"]::-webkit-calendar-picker-indicator { 
            filter: invert(1); 
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ECRÃ DE LOGIN -->
    <div id="login-page" class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm space-y-8 text-center">
            <span class="text-6xl font-extrabold text-blue-500 tracking-tighter italic">I3O</span>
            <div class="glass-card p-8 rounded-[2.5rem] space-y-4 shadow-2xl">
                <div>
                    <label class="block text-left text-[10px] font-bold uppercase text-slate-400 mb-1 ml-2">Utilizador</label>
                    <input type="text" id="user-input" class="w-full bg-slate-900/50 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-blue-500 transition-all" placeholder="Ex: admin">
                </div>
                <div>
                    <label class="block text-left text-[10px] font-bold uppercase text-slate-400 mb-1 ml-2">Palavra-passe</label>
                    <input type="password" id="pass-input" class="w-full bg-slate-900/50 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-blue-500 transition-all" placeholder="••••••••">
                </div>
                <button id="login-btn" onclick="login()" class="w-full neo-click bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-bold uppercase tracking-widest text-sm shadow-lg shadow-blue-600/20 text-white transition-all flex items-center justify-center space-x-2">
                    <span id="login-btn-text">Entrar</span>
                    <span id="login-spinner" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (DASHBOARD) -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <!-- NAV BAR -->
        <nav class="glass-card sticky top-0 z-50 p-5 flex justify-between items-center border-b border-white/10">
            <div>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sessão Ativa</p>
                <h2 id="display-nome" class="text-lg font-extrabold text-white">--</h2>
            </div>
            <button onclick="location.reload()" class="text-red-400 hover:text-red-300 text-[10px] font-black uppercase bg-red-500/10 hover:bg-red-500/20 px-4 py-2.5 rounded-xl border border-red-500/20 transition-all">Sair</button>
        </nav>

        <!-- TAB REGISTO DE PONTO -->
        <main id="tab-ponto" class="p-6 max-w-md mx-auto w-full space-y-6 flex-1 overflow-y-auto no-scrollbar pb-24">
            <div class="glass-card rounded-[3rem] p-8 text-center shadow-2xl relative overflow-hidden">
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Hora Atual</div>
                <div id="clock" class="text-5xl font-black tracking-tighter text-white">00:00:00</div>
                <div id="role-label" class="inline-block bg-blue-500/10 text-blue-400 text-[10px] font-black uppercase mt-3 px-3 py-1 rounded-full border border-blue-500/20">--</div>
            </div>

            <div class="grid grid-cols-1 gap-4 text-white">
                <button id="btn-entrada" onclick="registarPonto('ENTRADA')" class="neo-click btn-punch-in h-24 rounded-[2rem] flex items-center justify-between px-8 text-left shadow-lg transition-all">
                    <span class="text-2xl font-black italic tracking-tighter">ENTRADA</span>
                    <svg class="w-8 h-8 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                </button>
                <button id="btn-saida" onclick="registarPonto('SAÍDA')" class="neo-click btn-punch-out h-24 rounded-[2rem] flex items-center justify-between px-8 text-left shadow-lg transition-all">
                    <span class="text-2xl font-black italic tracking-tighter">SAÍDA</span>
                    <svg class="w-8 h-8 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H3m6 4v1a3 3 0 01-3 3H3a3 3 0 01-3-3V7a3 3 0 013-3h3a3 3 0 013 3v1"></path></svg>
                </button>
            </div>

            <div class="space-y-4">
                <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-2">Últimos Registos</h3>
                <div id="meu-historico-corpo" class="space-y-3"></div>
            </div>
        </main>

        <!-- TAB ADMIN / GESTÃO -->
        <main id="tab-admin" class="hidden p-6 max-w-5xl mx-auto w-full space-y-10 flex-1 overflow-y-auto no-scrollbar pb-32 text-white">
            
            <section class="space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <h2 class="text-xl font-black italic uppercase tracking-wider text-blue-400">Registos do Dia</h2>
                    <input type="date" id="filtro-data" onchange="renderizarTabelaAdmin()" class="bg-slate-900/80 text-blue-400 font-bold p-3 rounded-xl text-xs outline-none border border-blue-500/30 focus:border-blue-500">
                </div>
                <div class="glass-card rounded-[2rem] overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-400 border-b border-white/5">
                            <tr>
                                <th class="p-4">Colaborador</th>
                                <th class="p-4">Entrada</th>
                                <th class="p-4">Saída</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-admin-corpo" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
                <button onclick="exportarExcel()" class="w-full py-4 glass-card hover:bg-emerald-500/10 border-emerald-500/20 transition-all rounded-2xl font-bold text-emerald-400 text-sm flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Exportar Todos os Registos (CSV)</span>
                </button>
            </section>

            <section class="space-y-4">
                <h2 class="text-xl font-black italic uppercase tracking-wider text-blue-400">Novo Colaborador</h2>
                <div class="glass-card p-6 rounded-[2rem] grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1 block">Nome Completo</label>
                        <input type="text" id="add-nome" class="w-full bg-slate-900/50 border border-white/10 rounded-xl p-3 text-sm outline-none focus:border-blue-500" placeholder="Ex: André Silva">
                    </div>
                    <div>
                        <label class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1 block">Utilizador (Login)</label>
                        <input type="text" id="add-user" class="w-full bg-slate-900/50 border border-white/10 rounded-xl p-3 text-sm outline-none focus:border-blue-500" placeholder="Ex: andre">
                    </div>
                    <div>
                        <label class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1 block">Palavra-Passe</label>
                        <input type="text" id="add-pass" class="w-full bg-slate-900/50 border border-white/10 rounded-xl p-3 text-sm outline-none focus:border-blue-500" placeholder="Ex: 1234">
                    </div>
                    <button onclick="adicionarMembro()" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold uppercase text-xs neo-click transition-all">Adicionar</button>
                </div>
            </section>

            <section class="space-y-4">
                <h2 class="text-xl font-black italic uppercase tracking-wider text-blue-400">Gestão de Equipa</h2>
                <div class="glass-card rounded-[2rem] overflow-hidden overflow-x-auto no-scrollbar">
                    <table class="w-full text-left text-sm min-w-[600px]">
                        <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-400 border-b border-white/5">
                            <tr>
                                <th class="p-4">Nome</th>
                                <th class="p-4">Utilizador</th>
                                <th class="p-4">Palavra-Passe</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-users-corpo" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- BARRA DE NAVEGAÇÃO BOTTOM (ADMIN) -->
        <div id="admin-nav" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass-card rounded-full p-2 flex justify-around shadow-2xl border-white/20 z-50">
            <button id="nav-ponto-btn" onclick="switchTab('ponto')" class="flex-1 py-3 font-bold text-xs uppercase text-blue-400 rounded-full transition-all">Ponto</button>
            <button id="nav-admin-btn" onclick="switchTab('admin')" class="flex-1 py-3 font-bold text-xs uppercase text-slate-400 rounded-full transition-all">Gestão I3O</button>
        </div>
    </div>

    <script>
        // URL do Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqJ1t5_okXslBvfFYZwGVle4M5Pje0-MwYj_oNe7mYSGRcO2h28Nm8NfK-oOYmg7SV/exec';

        let currentUser = null;
        let dbEquipa = [];
        let dbPontos = [];

        async function carregarDadosBase() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInitialData`);
                const data = await response.json();
                dbEquipa = data.equipa || [];
                dbPontos = data.pontos || [];
                return true;
            } catch (err) {
                console.error(err);
                alert("Erro ao comunicar com o Google Sheets. Verifique a ligação.");
                return false;
            }
        }

        async function login() {
            const uInput = document.getElementById('user-input').value.trim().toLowerCase();
            const pInput = document.getElementById('pass-input').value;

            if (!uInput || !pInput) {
                alert("Por favor, preencha o utilizador e a palavra-passe.");
                return;
            }

            // Mostrar estado de carregamento
            document.getElementById('login-btn-text').innerText = "A carregar...";
            document.getElementById('login-spinner').classList.remove('hidden');

            const ok = await carregarDadosBase();

            document.getElementById('login-btn-text').innerText = "Entrar";
            document.getElementById('login-spinner').classList.add('hidden');

            if (!ok) return;

            const user = dbEquipa.find(item => item.id.toLowerCase() === uInput);

            if (user && user.pass === pInput) {
                currentUser = user;
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('display-nome').innerText = currentUser.nome;
                document.getElementById('role-label').innerText = currentUser.role;
                document.getElementById('filtro-data').value = new Date().toISOString().split('T')[0];
                
                if (currentUser.role === 'ADMIN') {
                    document.getElementById('admin-nav').classList.remove('hidden');
                    renderizarGestaoUsuarios();
                }
                atualizarUI();
            } else { 
                alert("Login falhou. Verifique o utilizador e a palavra-passe."); 
            }
        }

        async function registarPonto(tipo) {
            const agora = new Date();
            const payload = {
                action: 'registarPonto',
                user_id: currentUser.id,
                nome: currentUser.nome,
                tipo: tipo,
                data_iso: agora.toISOString().split('T')[0],
                data_pt: agora.toLocaleDateString('pt-PT'),
                hora: agora.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })
            };

            // Atualização Otimista na UI
            dbPontos.push(payload);
            atualizarUI();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Erro ao enviar registo:", e);
            }
        }

        function atualizarUI() {
            const hoje = new Date().toISOString().split('T')[0];
            
            const meusHoje = dbPontos.filter(r => r.user_id === currentUser.id && r.data_iso === hoje);
            const ultimo = meusHoje.length > 0 ? meusHoje[meusHoje.length - 1] : null;

            document.getElementById('btn-entrada').classList.toggle('btn-locked', !!(ultimo && ultimo.tipo === 'ENTRADA'));
            document.getElementById('btn-saida').classList.toggle('btn-locked', !ultimo || ultimo.tipo === 'SAÍDA');

            const historico = dbPontos
                .filter(r => r.user_id === currentUser.id)
                .slice(-5)
                .reverse();

            const histContainer = document.getElementById('meu-historico-corpo');
            if (historico.length === 0) {
                histContainer.innerHTML = `<div class="p-6 text-center text-slate-500 font-bold text-xs glass-card rounded-2xl">Sem registos recentes</div>`;
            } else {
                histContainer.innerHTML = historico.map(r => `
                    <div class="glass-card p-4 rounded-2xl flex justify-between items-center border-l-4 ${r.tipo === 'ENTRADA' ? 'border-emerald-500' : 'border-rose-500'}">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400">${r.data_pt}</p>
                            <p class="font-extrabold italic uppercase text-xs ${r.tipo === 'ENTRADA' ? 'text-emerald-400' : 'text-rose-400'}">${r.tipo}</p>
                        </div>
                        <p class="text-xl font-black text-white">${r.hora}</p>
                    </div>`).join('');
            }

            if (currentUser.role === 'ADMIN') renderizarTabelaAdmin();
        }

        function renderizarTabelaAdmin() {
            const filtro = document.getElementById('filtro-data').value;
            const filtrados = dbPontos.filter(r => r.data_iso === filtro);

            const agrupado = {};
            filtrados.forEach(r => {
                if (!agrupado[r.nome]) agrupado[r.nome] = { e: '--:--', s: '--:--' };
                if (r.tipo === 'ENTRADA') agrupado[r.nome].e = r.hora;
                if (r.tipo === 'SAÍDA') agrupado[r.nome].s = r.hora;
            });

            const html = Object.entries(agrupado).map(([n, p]) => `
                <tr class="text-xs font-bold">
                    <td class="p-4 text-white">${n}</td>
                    <td class="p-4 text-emerald-400">${p.e}</td>
                    <td class="p-4 text-rose-400">${p.s}</td>
                </tr>`).join('');

            document.getElementById('tabela-admin-corpo').innerHTML = html || '<tr><td colspan="3" class="p-8 text-center text-slate-500 text-xs">Nenhum registo nesta data.</td></tr>';
        }

        function renderizarGestaoUsuarios() {
            const corpo = document.getElementById('tabela-users-corpo');
            corpo.innerHTML = dbEquipa.map(u => `
                <tr class="text-xs">
                    <td class="p-3"><input type="text" id="edit-nome-${u.id}" value="${u.nome}" class="bg-slate-900/50 border border-white/10 rounded-lg px-2 py-1.5 w-full text-white font-bold outline-none focus:border-blue-500"></td>
                    <td class="p-3"><span class="text-slate-400 font-mono">${u.id}</span></td>
                    <td class="p-3"><input type="text" id="edit-pass-${u.id}" value="${u.pass}" class="bg-slate-900/50 border border-white/10 rounded-lg px-2 py-1.5 w-full text-blue-400 outline-none focus:border-blue-500"></td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="salvarAlteracoes('${u.id}')" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 text-[10px] px-3 py-1.5 rounded-lg font-bold transition-all border border-emerald-500/30">Guardar</button>
                        ${u.id === 'admin' ? '' : `<button onclick="removerMembro('${u.id}')" class="bg-rose-600/20 hover:bg-rose-600/40 text-rose-400 text-[10px] px-3 py-1.5 rounded-lg font-bold transition-all border border-rose-500/30">Eliminar</button>`}
                    </td>
                </tr>`).join('');
        }

        async function adicionarMembro() {
            const n = document.getElementById('add-nome').value.trim();
            const u = document.getElementById('add-user').value.trim().toLowerCase();
            const p = document.getElementById('add-pass').value.trim();
            if (!n || !u || !p) return alert("Preencha todos os campos!");

            const payload = { action: 'adicionarMembro', id: u, nome: n, pass: p, role: 'USER' };
            
            dbEquipa.push({ id: u, nome: n, pass: p, role: 'USER' });
            renderizarGestaoUsuarios();

            document.getElementById('add-nome').value = ''; 
            document.getElementById('add-user').value = ''; 
            document.getElementById('add-pass').value = '';

            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("Colaborador adicionado com sucesso!");
        }

        async function salvarAlteracoes(id) {
            const novoNome = document.getElementById(`edit-nome-${id}`).value;
            const novaPass = document.getElementById(`edit-pass-${id}`).value;
            
            const user = dbEquipa.find(u => u.id === id);
            if (user) {
                user.nome = novoNome;
                user.pass = novaPass;
            }

            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'salvarMembro', id, nome: novoNome, pass: novaPass })
            });
            alert("Dados de " + novoNome + " atualizados!");
        }

        async function removerMembro(id) {
            if (confirm("Tem certeza que deseja eliminar este colaborador?")) {
                dbEquipa = dbEquipa.filter(u => u.id !== id);
                renderizarGestaoUsuarios();

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'removerMembro', id })
                });
            }
        }

        function exportarExcel() {
            let csv = "NOME;DATA;TIPO;HORA\n";
            dbPontos.forEach(r => { csv += `${r.nome};${r.data_pt};${r.tipo};${r.hora}\n`; });
            const blob = new Blob(["\ufeff", csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Relatorio_Ponto_I3O.csv`;
            link.click();
        }

        function switchTab(t) {
            document.getElementById('tab-ponto').classList.toggle('hidden', t !== 'ponto');
            document.getElementById('tab-admin').classList.toggle('hidden', t !== 'admin');
            
            const pBtn = document.getElementById('nav-ponto-btn');
            const aBtn = document.getElementById('nav-admin-btn');

            if (t === 'ponto') {
                pBtn.className = "flex-1 py-3 font-bold text-xs uppercase text-blue-400 bg-blue-500/10 rounded-full transition-all border border-blue-500/20";
                aBtn.className = "flex-1 py-3 font-bold text-xs uppercase text-slate-400 rounded-full transition-all";
            } else {
                aBtn.className = "flex-1 py-3 font-bold text-xs uppercase text-blue-400 bg-blue-500/10 rounded-full transition-all border border-blue-500/20";
                pBtn.className = "flex-1 py-3 font-bold text-xs uppercase text-slate-400 rounded-full transition-all";
            }
        }

        setInterval(() => { 
            const el = document.getElementById('clock');
            if (el) el.innerText = new Date().toLocaleTimeString('pt-PT'); 
        }, 1000);
    </script>
</body>
</html>
